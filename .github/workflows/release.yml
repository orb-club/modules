name: Publish npm package

on:
  push:
    tags:
      - "modules-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    environment: npm
    env:
      NPM_TOKEN_SET: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install

      - name: Verify release tag
        run: |
          node -e 'const pkg = require("./package.json"); const tag = process.env.GITHUB_REF_NAME; const expected = `modules-v${pkg.version}`; if (pkg.name !== "@orbclub/modules") { throw new Error(`Unexpected package name ${pkg.name}`); } if (tag !== expected) { throw new Error(`Tag ${tag} does not match package version ${expected}`); } console.log(`${pkg.name}@${pkg.version}`);'

      - name: Typecheck
        run: bun run check

      - name: Test
        run: bun run test

      - name: Type tests
        run: bun run test:types

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Package dry run
        run: npm pack --dry-run

      - name: Check npm version
        id: npm-version
        run: |
          node - <<'NODE'
          const { execFileSync } = require("node:child_process");
          const { appendFileSync } = require("node:fs");
          const pkg = require("./package.json");

          let published = false;
          try {
            const version = execFileSync(
              "npm",
              ["view", `${pkg.name}@${pkg.version}`, "version"],
              { encoding: "utf8", stdio: ["ignore", "pipe", "ignore"] },
            ).trim();
            published = version === pkg.version;
          } catch {
            published = false;
          }

          appendFileSync(process.env.GITHUB_OUTPUT, `published=${published}\n`);
          console.log(`${pkg.name}@${pkg.version} published: ${published}`);
          NODE

      - name: Publish to npm with trusted publishing
        if: env.NPM_TOKEN_SET == 'false' && steps.npm-version.outputs.published != 'true'
        run: npm publish --access public

      - name: Publish to npm with bootstrap token
        if: env.NPM_TOKEN_SET == 'true' && steps.npm-version.outputs.published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
