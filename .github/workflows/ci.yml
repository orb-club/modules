name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run check

      - name: Test
        run: bun run test

      - name: Type tests
        run: bun run test:types

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Package dry run
        run: npm pack --dry-run
